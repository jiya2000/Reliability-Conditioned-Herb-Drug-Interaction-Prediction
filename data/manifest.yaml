# Manifest of Public Datasets for Reliability- and Context-Aware Herb–Drug Interaction Prediction
# Note: Values for 'license_verified' are false pending formal audit of redistribution terms.

datasets:
  - name: HERB
    role: biological_knowledge_graph
    public_access: true
    license_verified: false
    source_url: "http://herb.ac.cn/"
    paper_reference: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7779036/"
    description: "High-throughput Experiment- and Reference-guided database of TCM. Provides herb-compound-target relationships and literature evidence."
    expected_files:
      - "HERB_herb_info.csv"
      - "HERB_ingredient_info.csv"
      - "HERB_target_info.csv"
      - "HERB_herb_ingredient_pairs.csv"
      - "HERB_ingredient_target_pairs.csv"

  - name: Dryad_TCM_network
    role: biological_knowledge_graph
    public_access: true
    license_verified: false
    source_url: "https://datadryad.org/dataset/doi:10.5061/dryad.wh70rxwx9"
    paper_reference: "https://doi.org/10.5061/dryad.wh70rxwx9"
    description: "Public TCM network data on Dryad. 1,254 herbs, 2,208 targets, providing independent graph topology."
    expected_files:
      - "herb_target_network.csv"
      - "herb_compound_network.csv"

  - name: HDI_evidence
    role: labeled_interaction_evidence
    public_access: pending
    license_verified: false
    source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12241595/"
    description: "InterPAD phytochemical-drug interaction database / open-access curated literature evidence with traceable DOI/PMID records."
    expected_files:
      - "hdi_evidence_records.csv"

  - name: DrugBank_DDI_Auxiliary
    role: auxiliary_benchmark
    public_access: restricted
    license_verified: true
    source_url: "https://go.drugbank.com/"
    description: "DrugBank benchmark retained strictly as an auxiliary evaluation baseline, not claimed as botanical HDI ground truth."
    expected_files:
      - "data/processed/drugbank_parsed.json"

rules:
  unknown_is_negative: false
  retain_source_references: true
  retain_original_identifiers: true
  evidence_level_granularity: true
  require_audit_trail: true
